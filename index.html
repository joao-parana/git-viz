<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Git Viz — Visualizador Interativo de Git</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="main">
            <div id="toolbar-root" class="toolbar"></div>
            <div class="layout">
                <div id="graph-container" class="graph-area">
                    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
                    <div class="hint" id="hint-text"></div>
                </div>
                <aside id="history-root"></aside>
            </div>
        </main>
        <div id="modal-root"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
